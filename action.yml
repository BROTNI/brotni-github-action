name: 'Brotni Simulation'
description: >
  Register a GitHub pull request, commit, or OCI artifact as a candidate in an
  existing Brotni simulation campaign and publish a campaign-scoped check/comment
  back to GitHub. Registration is idempotent by candidate name.
author: 'BROTNI'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  brotni-api-url:
    description: >
      Base URL of the Brotni-compatible simulation API endpoint.
      Falls back to the BROTNI_API_URL environment variable.
    required: false

  brotni-token:
    description: >
      Authentication token for the Brotni API.
      Falls back to the BROTNI_TOKEN environment variable.
    required: false

  execution-recipe:
    description: 'Path or URI of the execution recipe used to run this candidate.'
    required: false

  artifact-uri:
    description: >
      URI of the artifact to submit as a simulation candidate
      (e.g. an OCI image reference such as ghcr.io/org/image:tag).
    required: false

  artifact-digest:
    description: >
      Content-addressable digest of the artifact (e.g. sha256:abc123...).
      Use this with artifact-uri to pin an immutable reference.
    required: false

  candidate-name:
    description: 'Human-readable name for this simulation candidate.'
    required: false

  campaign-id:
    description: >
      Brotni campaign ID to register this candidate with. Required — the action
      registers the build as a candidate in an existing campaign.
    required: true

  candidate-label:
    description: >
      PR label that marks a pull request as a campaign candidate for
      label-based discovery.
    required: false
    default: 'brotni-simulation-candidate'

  source-kind:
    description: >
      Candidate source kind: git_change, container_image, or config_bundle.
      Inferred from the artifact inputs when omitted.
    required: false

  publish-comment:
    description: >
      Post a campaign-scoped PR comment with this candidate's status and a link
      to the campaign comparison. Requires pull-requests: write and a
      pull_request event.
    required: false
    default: 'false'

  publish-check:
    description: >
      Create a GitHub Check Run with the campaign-scoped result.
      Requires checks: write permission.
    required: false
    default: 'false'

  github-token:
    description: >
      GitHub token used to post comments and check runs.
      Defaults to the automatically provided github.token.
    required: false
    default: ${{ github.token }}

outputs:
  candidate-id:
    description: 'Studio-minted identifier of the registered candidate.'

  campaign-url:
    description: 'URL to the campaign comparison view, when provided by the studio.'

  simulation-status:
    description: >
      Candidate status: "registered" right after registration, or "passed" /
      "failed" once the campaign decision includes this candidate.

  simulation-score:
    description: "This candidate's overall score from the campaign decision, if available."

runs:
  using: 'node20'
  main: 'dist/index.js'
